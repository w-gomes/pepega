[package]
name = "pepega"
version = "0.9.0"
edition = "2021"

[dependencies]
anyhow = "1.0.95"
chrono = "0.4.42"
clap = { version = "4.5.26", features = ["derive"] }
smallvec = "1.15.1"
tempfile = "3.15.0"

[profile.dev]
opt-level = 0
debug = 2
debug-assertions = true
overflow-checks = true
incremental = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -2 }

single_match = "warn"
single_match_else = "warn"
needless_match = "warn"
needless_late_init = "warn"
needless_bool = "deny"
redundant_pattern_matching = "warn"
redundant_pattern = "warn"
redundant_guards = "warn"
match_single_binding = "warn"
match_same_arms = "warn"
match_ref_pats = "warn"
match_bool = "warn"
collapsible_match = "warn"
unwrap_used = "warn"
expect_used = "warn"

todo = "warn"
dbg_macro = "warn"
unimplemented = "warn"
